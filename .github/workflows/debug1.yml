name: extra_ssh
on:
  workflow_dispatch:

jobs:

  start_ssh:
    runs-on: ubuntu-20.04
    steps:
    - uses: actions/checkout@v4
    - name: download doc
      run: |
        echo "update"
        sudo apt update
        sudo apt install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python2 rename libelf-dev dwarves
        sudo apt list --upgradable
        sudo apt upgrade
        #这里宿主机使用Ubuntu20.04系统
        sudo apt install binfmt-support qemu-user-static gcc-10-aarch64-linux-gnu kernel-package fakeroot simg2img img2simg mkbootimg bison flex gcc-aarch64-linux-gnu pkg-config libncurses-dev libssl-dev unzip git debootstrap

        touch /tmp/keepalive
        cd ~
        git config --global user.email "991350086@qq.com"
        git config --global user.name "lengxiaohua"
        git clone https://github.com/umeiko/KlipperPhonesLinux.git --depth=1
        cd ~/KlipperPhonesLinux/LinuxKernels/scripts
        chmod +x *.sh
        ./init.sh
        export git_path=~/work/aosp_kernel_gki_builder/aosp_kernel_gki_builder
        echo "export git_path=~/work/aosp_kernel_gki_builder/aosp_kernel_gki_builder" >> ~/.bashrc

        mkdir -p ~/workspaces
        cd $git_path
        cp linux* *.dtb Image.gz ~/workspaces
        cd ~/workspaces
        dd if=/dev/zero of=rootfs-focal.img bs=1G count=2
        mkfs.ext4 rootfs-focal.img
        mkdir ~/chroot
        sudo mount rootfs-focal.img ~/chroot
        sudo debootstrap --arch arm64 jammy ~/chroot https://mirrors.aliyun.com/ubuntu-ports

        sudo mount --bind /proc ~/chroot/proc
        sudo mount --bind /dev ~/chroot/dev
        sudo mount --bind /dev/pts ~/chroot/dev/pts
        sudo mount --bind /sys ~/chroot/sys

        sudo chroot ~/chroot
        cat > /etc/apt/sources.list << EOF
        deb https://mirrors.aliyun.com/ubuntu-ports/ jammy main restricted universe multiverse
        deb-src https://mirrors.aliyun.com/ubuntu-ports/ jammy main restricted universe multiverse
        
        deb https://mirrors.aliyun.com/ubuntu-ports/ jammy-security main restricted universe multiverse
        deb-src https://mirrors.aliyun.com/ubuntu-ports/ jammy-security main restricted universe multiverse
        
        deb https://mirrors.aliyun.com/ubuntu-ports/ jammy-updates main restricted universe multiverse
        deb-src https://mirrors.aliyun.com/ubuntu-ports/ jammy-updates main restricted universe multiverse
        
        # deb https://mirrors.aliyun.com/ubuntu-ports/ jammy-proposed main restricted universe multiverse
        # deb-src https://mirrors.aliyun.com/ubuntu-ports/ jammy-proposed main restricted universe multiverse
        
        deb https://mirrors.aliyun.com/ubuntu-ports/ jammy-backports main restricted universe multiverse
        deb-src https://mirrors.aliyun.com/ubuntu-ports/ jammy-backports main restricted universe multiverse
        EOF
        
        apt update && apt upgrade
        #设置locales
        locale-gen en_US.UTF-8
        locale-gen zh_CN.UTF-8
        #设置中国时区
        rm /etc/localtime
        ln -s /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
        #设置hostname
        echo 'xiaomi-gemini' > /etc/hostname
        #卸载netplan
        apt purge netplan.io
        #创建用户
        useradd -m -s /bin/bash hol
        usermod -aG sudo hol
        #设置密码
        passwd hol
        #安装一些包
        apt install man man-db bash-completion vim tmux network-manager chrony openssh-server initramfs-tools --no-install-recommends -y
        mkdir /tmp
        exit

        cd ~/workspaces

        cp ~/workspaces/linux*.deb ~/chroot/tmp

        sudo chroot ~/chroot
        cd /tmp
        dpkg --get-selections | grep linux
        dpkg -l | grep -E "linux-headers|linux-image" |awk '{print $2}'|xargs dpkg -P
        rm -rf /lib/modules/*
        
        dpkg -i linux*.deb
        dpkg --get-selections | grep linux
        
        ls /lib/modules
        exit

        cp -r ~/KlipperPhonesLinux/LinuxKernels/msm8996/firmware/* ~/chroot/usr/lib/firmware/
        
        sudo chroot ~/chroot
        cd /usr/lib/firmware/
        ldconfig

        cat > /etc/systemd/system/resizefs.service << 'EOF'
        [Unit]
        Description=Expand root filesystem to fill partition
        After=local-fs.target
        
        [Service]
        Type=oneshot
        ExecStart=/usr/bin/bash -c 'exec /usr/sbin/resize2fs $(findmnt -nvo SOURCE /)'
        ExecStartPost=/usr/bin/systemctl disable resizefs.service
        RemainAfterExit=true
        
        [Install]
        WantedBy=default.target
        EOF
        systemctl enable resizefs.service

        cat > /etc/systemd/system/serial-getty@ttyGS0.service << EOF
        [Unit]
        Description=Serial Console Service on ttyGS0
        
        [Service]
        ExecStart=-/usr/sbin/agetty -L 115200 ttyGS0 xterm+256color
        Type=idle
        Restart=always
        RestartSec=0
        
        [Install]
        WantedBy=multi-user.target
        EOF
        systemctl enable serial-getty@ttyGS0.service
        #如果串口登录失效，可能是g_serial模块没有加载
        echo g_serial >> /etc/modules
        apt clean
        rm -f /tmp/*
        history -c
        exit

        mkdir ~/workspaces/tmp_mkboot
        rm -rf ~/workspaces/tmp_mkboot/*
        cp ~/workspaces/*.dtb ~/workspaces/tmp_mkboot/
        cp ~/workspaces/Image.gz ~/workspaces/tmp_mkboot/
        cp ~/chroot/boot/initrd* ~/workspaces/tmp_mkboot/
        
        cp ~/workspaces/tmp_mkboot/initrd* ~/workspaces/tmp_mkboot/initrd.img
        cp ~/workspaces/tmp_mkboot/*.dtb ~/workspaces/tmp_mkboot/dtb
        cat ~/workspaces/tmp_mkboot/Image.gz ~/workspaces/tmp_mkboot/dtb > ~/workspaces/tmp_mkboot/kernel-dtb
        
    - name: Set Swap to 10GB
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10
    - name: Setup tmate session
      uses: csexton/debugger-action@master

    - name: tar file
      run: |
           cd
           tar -czvf out.tar.gz ~/workspaces

    - name: Upload KernelSU boot image
      uses: actions/upload-artifact@v4.3.1
      with:
        name: out_file.tar.gz
        path: ~/out.tar.gz
        if-no-files-found: error
