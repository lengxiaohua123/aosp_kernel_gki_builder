name: build mokee
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
    - name: Before freeing up disk space
      run: |
        echo "Before freeing up disk space"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: "Optimize Disk Space"
      uses: "hugoalh/disk-space-optimizer-ghaction@v0.8.1"
      with:
        operate_sudo: "True"
        general_include: ".+"
        general_exclude: |-
          ^GCC$
          ^G\+\+$
          Clang
          LLVM
        docker_include: ".+"
        docker_prune: "True"
        docker_clean: "True"
        apt_prune: "True"
        apt_clean: "True"
        homebrew_prune: "True"
        homebrew_clean: "True"
        npm_prune: "True"
        npm_clean: "True"
        os_swap: "True"

    - name: Freeing up disk space
      uses: easimon/maximize-build-space@master
      with: 
        root-reserve-mb: 2048
        swap-size-mb: 1
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: Free up disk space complete
      run: |
        echo "Free up disk space complete"
        echo "=============================================================================="
        df -hT
        echo "=============================================================================="

    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      run: |
           echo "update"
           sudo apt update
           sudo apt upgrade -y
           sudo apt install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses5-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python2 rename libelf-dev dwarves
           sudo apt install binfmt-support qemu-user-static gcc-10-aarch64-linux-gnu kernel-package fakeroot simg2img img2simg mkbootimg bison flex gcc-aarch64-linux-gnu pkg-config libncurses-dev libssl-dev unzip git debootstrap -y
           sudo apt-get update && sudo apt-get install bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libwxgtk3.0-gtk3-dev
           sudo apt-get install python
           mkdir ~/out
           cd ~
           git config --global user.email "991350086@qq.com"
           git config --global user.name "lengxiaohua"
           mkdir -p ~/bin
           curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
           sudo cp ~/bin/repo /bin/repo
           sudo chmod a+x /bin/repo

    - name: Set Swap to 8GB
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 8

    - name: download source
      run: |
           cd /home/runner/work/aosp_kernel_gki_builder/aosp_kernel_gki_builder
           mkdir mokee
           cd mokee
           repo init -u https://github.com/MoKee/android.git -b mkq-mr1 --depth=1
           repo sync --current-branch --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc --all)

           git clone https://github.com/MoKee/android_device_meizu_m1971.git -b mkq-mr1 device/meizu/m1971
           git clone https://github.com/MoKee/android_device_meizu_sm8150-common.git -b mkq-mr1 device/meizu/sm8150-common
           git clone https://github.com/mokee/android_vendor_meizu_m1971.git -b mkq-mr1 vendor/meizu/m1971
           git clone https://github.com/mokee/android_vendor_meizu_sm8150-common.git -b mkq-mr1 vendor/meizu/sm8150-common
           git clone --depth=1 https://github.com/mokee/android_kernel_meizu_sm8150.git -b mkq-mr1 kernel/meizu/sm8150
           source build/envsetup.sh
           lunch mokee_m1971-userdebug
           mka bacon

    - name: tar file
      run: |
           cd
           tar -czvf out.tar.gz ~/out

    - name: Upload out
      uses: actions/upload-artifact@v4.3.1
      with:
        name: out_file.tar.gz
        path: ~/out.tar.gz
        if-no-files-found: error
